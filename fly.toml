# fly.toml app configuration file generated for golden-knot-api on 2026-08-25T11:16:24+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'golden-knot-api'
primary_region = 'fra'

[build]
[deploy]
  release_command = 'pnpm --filter api exec prisma migrate deploy'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
